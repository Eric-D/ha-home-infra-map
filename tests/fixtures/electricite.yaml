# Maison de démonstration (fictive) — format « fichiers de la maison ».
# Repérage : T<tableau>-R<rangée>-<position>. « ? » = circuit à identifier.
# arrivee: = compteur + disjoncteur de branchement ; alimente_par: = élément qui
# alimente (par défaut le différentiel à gauche sur la rangée) ; etat: réserve / coupé.
tableaux:
  - id: T1
    nom: Tableau principal
    emplacement: Cellier
    photo: photos/tableau_principal.jpg
    modules_par_rangee: 13
    arrivee:
      compteur: {modele: Compteur communicant, puissance_souscrite: 9 kVA, entite_puissance: sensor.compteur_puissance_apparente}
      disjoncteur: {modele: Différentiel sélectif S, calibre: 45A, sensibilite: 500mA, note: "réglage 30-45 A, sélectif"}
    rangees:
      - id: T1-R1
        elements:
          - differentiel: {repere: T1-R1-ID, modele: ID 40A 30mA, calibre: 40A, sensibilite: 30mA, type: AC, largeur: 2}
          - disjoncteur: {repere: T1-R1-1, calibre: C10, circuit: Éclairage séjour}
          - disjoncteur: {repere: T1-R1-2, calibre: C10, circuit: Éclairage chambres, alerte: Prise sur un circuit éclairage (chambre 2)}
          - disjoncteur: {repere: T1-R1-3, calibre: C10, circuit: Éclairage extérieur, etat: coupé}
          - disjoncteur: {repere: T1-R1-4, calibre: C16, circuit: Prises séjour}
          - disjoncteur: {repere: T1-R1-5, calibre: C16, circuit: Prises chambres, nb_prises: 10}
          - disjoncteur: {repere: T1-R1-6, calibre: C16, circuit: "?"}
          - vide: 2
          - disjoncteur: {repere: T1-R1-7, calibre: C20, circuit: Lave-linge, note: "derrière un ID type AC : à vérifier"}
          - disjoncteur: {repere: T1-R1-8, calibre: C20, circuit: Réserve (futur atelier), etat: réserve}
      - id: T1-R2
        differentiel: {repere: T1-R2-ID, calibre: 40A, sensibilite: 30mA, type: A, largeur: 2}
        disjoncteurs:
          - {repere: T1-R2-1, calibre: C32, circuit: Plaque de cuisson, section: 6mm²}
          - {repere: T1-R2-2, calibre: C20, circuit: Four, section: "2,5"}
          - {repere: T1-R2-3, calibre: C20, circuit: Lave-vaisselle}
          - {repere: T1-R2-4, calibre: C16, circuit: Prises cuisine, pieces: [Cuisine]}
          - {repere: T1-R2-5, calibre: C16, circuit: "?"}
          - {vide: 1}
          - {repere: T1-R2-6, calibre: C20, circuit: Chauffe-eau}
        modules:
          - {type: Contacteur heures creuses, modele: CT 20A}
      - id: T1-R3
        elements:
          - differentiel: {repere: T1-R3-ID, calibre: 63A, sensibilite: 30mA, type: A, largeur: 2}
          - disjoncteur: {repere: T1-R3-1, calibre: C16, circuit: Prises bureau}
          - disjoncteur: {repere: T1-R3-2, calibre: C16, circuit: "?"}
          - module: {type: Module de mesure (compteur, 3 voies), modele: Compteur DIN, largeur: 2}
          - module: {type: Switch réseau DIN, largeur: 3}
          - module: {type: Parafoudre, largeur: 2}
          - disjoncteur: {repere: T1-R3-3, calibre: C2, circuit: Sonnette}
          - disjoncteur: {repere: T1-R3-4, calibre: C32, circuit: Départ tableau garage, alimente_par: arrivee}
  - id: T2
    nom: Tableau garage
    emplacement: Garage
    modules_par_rangee: 8
    alimente_par: T1-R3-4
    rangees:
      - id: T2-R1
        elements:
          - disjoncteur: {repere: T2-R1-1, calibre: C16, sensibilite: 30mA, type: A, circuit: Prises garage}
          - disjoncteur: {repere: T2-R1-2, calibre: C32, sensibilite: 30mA, type: A, circuit: Borne de recharge, largeur: 2}
          - vide: 2
          - module: {type: Prise DIN 2P+T 16A, largeur: 3}

# Boîtes de dérivation : gaines par côté (H haut, B bas, G gauche, D droite) et
# position ; tout est facultatif (« ? » = inconnu, côté sans numéro, gaine sans circuit).
boites:
  - boite: Boîte couloir étage
    emplacement: plafond, au-dessus de la porte de la chambre 1
    cotes: {haut: 3, bas: 2, gauche: 2, droite: 2}
    gaines:
      - {pos: G1, type: ICTA, diametre: 20, circuit: T1-R1-5, vient_de: tableau, cable: 3G2.5, longueur: 12, passage: gaine plafond, longe le mur nord}
      - {pos: G2, type: ICTA, diametre: 20, circuit: T1-R1-2, vient_de: tableau, cable: 3G1.5}
      - {pos: H1, circuit: T1-R1-2, vers: {lumiere: Chambre 1, nom: plafonnier}}
      - {pos: H2, circuit: T1-R1-2, vers: {lumiere: Chambre 2, nom: plafonnier}}
      - {pos: H3, reserve: true}
      - {pos: B1, circuit: T1-R1-5, vers: {boite: Boîte chambre 1, pos: H1}, longueur: 4}
      - {pos: D1, circuit: T1-R1-5, vers: {boite: Boîte chambre 2}, longueur: 6}
      - {pos: B2, circuit: T1-R2-4, vient_de: tableau}
      - {pos: D2, vers: {prise: Cuisine, nombre: 2}, relie_a: B2}
      - {nom: gaine grise, pos: "?", vers: "?"}
    connexions:
      - {type: Wago 221-413, fil: tous, circuit: T1-R1-5, relie: [G1, B1, D1]}
      - {type: Wago 221-415, fil: terre}
      - {type: Wago 221-413, fil: retour, circuit: T1-R1-2, relie: [G2, H1, H2]}
  - boite: Boîte chambre 1
    emplacement: plinthe derrière le lit
    gaines:
      - {pos: H1, circuit: T1-R1-5}
      - {pos: B1, circuit: T1-R1-5, vers: {prise: Chambre 1, nom: lit gauche}}
      - {pos: B2, circuit: T1-R1-5, vers: {prise: Chambre 1, nom: lit droite}}
      - {pos: D1, circuit: T1-R1-5, vers: {prise: Chambre 1, nom: bureau}}
  - boite: Boîte chambre 2
    emplacement: derrière l'armoire (non ouverte)
    circuits: [T1-R1-5, T1-R1-2]
    gaines:
      - {pos: B, circuit: T1-R1-5, vers: {prise: Chambre 2, nombre: 2}}
      - {nom: vers la fenêtre, circuit: T1-R1-5, vers: {prise: Chambre 2, nom: fenêtre, alerte: "noircie, à remplacer"}}
      - {nom: prise sur l'éclairage, circuit: T1-R1-2, vers: {prise: Chambre 2, nom: à côté de la porte}}
  - boite: Boîte grenier
    emplacement: grenier, sur la panne côté rue
    note: sert de rallonge, chaque entrée est reliée à une autre
    cotes: {haut: 2, bas: 2, gauche: 2, droite: 2}
    gaines:
      - {pos: G1, circuit: T1-R1-1, vient_de: tableau}
      - {pos: D1, vers: {lumiere: Séjour, nom: suspension}}
      - {pos: G2, circuit: T1-R1-4, vient_de: tableau}
      - {pos: D2, vers: {prise: Séjour, nombre: 3}}
      - {pos: H1, circuit: T1-R3-1, vient_de: tableau}
      - {pos: B1, vers: {prise: Bureau, nombre: 2}}
      - {pos: H2, nom: gaine noire}
      - {pos: B2, vers: "?"}
    liaisons: [[G1, D1], [G2, D2], [H1, B1], [H2, B2]]
