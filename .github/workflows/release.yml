name: Release

# Push a tag vX.Y.Z on main: versions are written in every file that carries
# one, the card is rebuilt, the suite runs on what is about to be published,
# then a release with the integration zip is created.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Install
        run: |
          python -m pip install -r requirements_test.txt
          python scripts/manifest_requirements.py
          python -m pip install -r manifest-requirements.txt
          (cd frontend && npm ci)
      - name: Write the version everywhere
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${VERSION}\"/" custom_components/home_infra_map/manifest.json
          sed -i "s/^VERSION: Final = \".*\"$/VERSION: Final = \"${VERSION}\"/" custom_components/home_infra_map/const.py
          sed -i "s/^version = \".*\"$/version = \"${VERSION}\"/" pyproject.toml
          sed -i "s/export const CARD_VERSION = '.*';/export const CARD_VERSION = '${VERSION}';/" frontend/src/version.ts
          (cd frontend && npm version --no-git-tag-version --allow-same-version "${VERSION}")
      - name: Build the card
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Tests on the code being released
        run: pytest -q
      - name: Commit and move the tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add custom_components/home_infra_map frontend/src/version.ts frontend/package.json frontend/package-lock.json pyproject.toml
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${{ steps.version.outputs.version }}"
            git push origin main
            git tag -f "$GITHUB_REF_NAME"
            git push origin "$GITHUB_REF_NAME" --force
          fi
      - name: Zip the integration
        run: cd custom_components/home_infra_map && zip -r ../../home_infra_map.zip . -x "__pycache__/*"
      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="## [${VERSION}]" 'index($0, v)==1 {p=1; next} /^## \[/ {p=0} p' CHANGELOG.md > RELEASE_NOTES.md
          [ -s RELEASE_NOTES.md ] || git log --pretty=format:"- %s" "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD" > RELEASE_NOTES.md
      - uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
          files: home_infra_map.zip
