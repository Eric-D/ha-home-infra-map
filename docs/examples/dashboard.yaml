# Example view generated by Home Infra Map.
# Dashboard > ⋮ > Edit > ⋮ > Raw configuration editor, then paste under `views:`.
- title: Maison
  path: home-infra-map
  icon: mdi:home-lightning-bolt-outline
  type: sections
  max_columns: 3
  sections:
  - type: grid
    cards:
    - type: heading
      heading: Électricité · Tableau principal
    - type: custom:home-infra-map-card
      view: electricity
      board: demo0000000000000000000000000001
      grid_options:
        columns: full
    - type: history-graph
      title: Puissance par rangée
      hours_to_show: 24
      entities:
      - sensor.home_infra_map_t1_puissance
      - sensor.home_infra_map_t1_r1_puissance
      - sensor.home_infra_map_t1_r2_puissance
      - sensor.home_infra_map_t1_r3_puissance
  - type: grid
    cards:
    - type: heading
      heading: Électricité · Tableau garage
    - type: custom:home-infra-map-card
      view: electricity
      board: demo0000000000000000000000000031
      grid_options:
        columns: full
    - type: history-graph
      title: Puissance par rangée
      hours_to_show: 24
      entities:
      - sensor.home_infra_map_t2_puissance
      - sensor.home_infra_map_t2_r1_puissance
  - type: grid
    cards:
    - type: heading
      heading: Réseau
    - type: custom:home-infra-map-card
      view: network
      network_view: topology
      grid_options:
        columns: full
    - type: custom:home-infra-map-card
      view: network
      network_view: vlan
      grid_options:
        columns: full
    - type: custom:home-infra-map-card
      view: network
      network_view: switch
      grid_options:
        columns: full
  - type: grid
    cards:
    - type: heading
      heading: Équipements
    - type: glance
      title: Admin
      show_state: false
      columns: 4
      entities:
      - binary_sensor.home_infra_map_routeur_pare_feu_en_ligne
      - binary_sensor.home_infra_map_switch_principal_24_ports_poe_en_ligne
      - binary_sensor.home_infra_map_serveur_de_virtualisation_en_ligne
      - binary_sensor.home_infra_map_point_d_acces_salon_en_ligne
      - binary_sensor.home_infra_map_point_d_acces_etage_en_ligne
    - type: glance
      title: Serveurs
      show_state: false
      columns: 4
      entities:
      - binary_sensor.home_infra_map_serveur_domotique_en_ligne
      - binary_sensor.home_infra_map_nas_en_ligne
    - type: glance
      title: Famille
      show_state: false
      columns: 4
      entities:
      - binary_sensor.home_infra_map_ordinateur_bureau_en_ligne
      - binary_sensor.home_infra_map_televiseur_salon_en_ligne
      - binary_sensor.home_infra_map_telephone_wi_fi_en_ligne
    - type: glance
      title: Objets
      show_state: false
      columns: 4
      entities:
      - binary_sensor.home_infra_map_camera_entree_en_ligne
      - binary_sensor.home_infra_map_camera_jardin_en_ligne
      - binary_sensor.home_infra_map_sonnette_video_hors_ligne_en_ligne
      - binary_sensor.home_infra_map_thermostat_connecte_en_ligne
      - binary_sensor.home_infra_map_prise_connectee_cuisine_en_ligne
      - binary_sensor.home_infra_map_module_de_mesure_electrique_en_ligne
      - binary_sensor.home_infra_map_station_meteo_wi_fi_en_ligne
      - binary_sensor.home_infra_map_imprimante_wi_fi_en_ligne
    - type: history-graph
      title: Latence (24 h)
      hours_to_show: 24
      entities:
      - sensor.home_infra_map_routeur_pare_feu_latence
      - sensor.home_infra_map_point_d_acces_salon_latence
      - sensor.home_infra_map_point_d_acces_etage_latence
      - sensor.home_infra_map_serveur_domotique_latence
      - sensor.home_infra_map_nas_latence
      - sensor.home_infra_map_station_meteo_wi_fi_latence
    - type: entities
      title: Blocages pare-feu (24 h)
      state_color: true
      entities:
      - sensor.home_infra_map_routeur_pare_feu_blocages
      - sensor.home_infra_map_switch_principal_24_ports_poe_blocages
      - sensor.home_infra_map_serveur_de_virtualisation_blocages
      - sensor.home_infra_map_point_d_acces_salon_blocages
      - sensor.home_infra_map_point_d_acces_etage_blocages
      - sensor.home_infra_map_serveur_domotique_blocages
      - sensor.home_infra_map_nas_blocages
      - sensor.home_infra_map_ordinateur_bureau_blocages
      - sensor.home_infra_map_televiseur_salon_blocages
      - sensor.home_infra_map_telephone_wi_fi_blocages
      - sensor.home_infra_map_camera_entree_blocages
      - sensor.home_infra_map_camera_jardin_blocages
      - sensor.home_infra_map_sonnette_video_hors_ligne_blocages
      - sensor.home_infra_map_thermostat_connecte_blocages
      - sensor.home_infra_map_prise_connectee_cuisine_blocages
      - sensor.home_infra_map_module_de_mesure_electrique_blocages
      - sensor.home_infra_map_station_meteo_wi_fi_blocages
      - sensor.home_infra_map_imprimante_wi_fi_blocages
